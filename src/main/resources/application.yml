server:
  port: 8080
spring:
  application:
    name: api-gateway-service
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: conference-service
              uri: ${CONFERENCE_SERVICE_URL}
              predicates:
                - Path=/conferences/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**
            - id: paper-service
              uri: ${PAPER_SERVICE_URL}
              predicates:
                - Path=/papers/**, /files/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${ALLOWED_ORIGINS}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: ${ZIPKIN_EXPORT_ENABLED:true}
        endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
  level:
    root: INFO
    "[org.springframework.cloud.gateway]": DEBUG
    "[org.springframework.cloud.gateway.filter]": DEBUG
    "[org.springframework.cloud.gateway.filter.factory]": DEBUG
    "[org.springframework.cloud.gateway.handler]": DEBUG
    "[org.springframework.cloud.gateway.handler.predicate]": DEBUG
    "[org.springframework.cloud.gateway.route]": DEBUG
    "[reactor.netty.http.client]": DEBUG
    "[reactor.netty.http.server]": DEBUG