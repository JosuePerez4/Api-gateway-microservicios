server:
  port: 8080
spring:
  application:
    name: api-gateway-service
  config:
    import: optional:file:.env[.properties]
  codec:
    max-in-memory-size: 50MB
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: conference-service
              uri: ${CONFERENCE_SERVICE_URL}
              predicates:
                - Path=/conferences/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**
            - id: paper-service
              uri: ${PAPER_SERVICE_URL}
              predicates:
                - Path=/papers/**, /files/**
            - id: registration-service
              uri: ${REGISTRATION_SERVICE_URL}
              predicates:
                - Path=/registrations/**
            - id: room-service
              uri: ${ROOM_SERVICE_URL}
              predicates:
                - Path=/rooms/**
            - id: schedule-service
              uri: ${SCHEDULE_SERVICE_URL}
              predicates:
                - Path=/schedule/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/notifications/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${ALLOWED_ORIGINS}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: ${ZIPKIN_EXPORT_ENABLED:true}
        endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
  level:
    root: INFO
    "[org.springframework.cloud.gateway]": DEBUG
    "[org.springframework.cloud.gateway.filter]": DEBUG
    "[org.springframework.cloud.gateway.filter.factory]": DEBUG
    "[org.springframework.cloud.gateway.handler]": DEBUG
    "[org.springframework.cloud.gateway.handler.predicate]": DEBUG
    "[org.springframework.cloud.gateway.route]": DEBUG
    "[reactor.netty.http.client]": DEBUG
    "[reactor.netty.http.server]": DEBUG